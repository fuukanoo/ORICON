# CISF アンカー設定（完全版8アンカー）
# 要件定義書に従い、業種横断の満足度分析を実現

anchors:
  usability:
    name: "使いやすさ"
    description: "UI/UX、手続きの容易さ、操作性"
    keywords: 
      - "使いやすさ"
      - "操作"
      - "画面"
      - "サイト"
      - "アプリ"
      - "手続き"
      - "申し込み"
      - "登録"
      - "容易"
      - "わかりやすさ"
      - "見やすさ"
      - "探しやすさ"
      - "再生"
    
  quality:
    name: "品質"
    description: "サービス品質、コンテンツ品質、技術性能"
    keywords:
      - "品質"
      - "性能"
      - "精度"
      - "効果"
      - "結果"
      - "成果"
      - "画質"
      - "音質"
      - "技術"
      - "レベル"
    
  trust_security:
    name: "信頼・安全性"
    description: "会社信頼性、個人情報保護、安全性"
    keywords:
      - "信頼"
      - "安心"
      - "安全"
      - "セキュリティ"
      - "会社"
      - "運営"
      - "管理"
      - "安定性"
      - "信頼性"
    
  price_value:
    name: "価格価値"
    description: "料金の妥当性、コストパフォーマンス"
    keywords:
      - "料金"
      - "価格"
      - "費用"
      - "コスト"
      - "安さ"
      - "値段"
      - "バランス"
      - "お得"
      - "適正"
    
  variety_options:
    name: "選択肢・多様性"
    description: "選択肢の豊富さ、サービス充実度"
    keywords:
      - "種類"
      - "豊富"
      - "選択肢"
      - "バラエティ"
      - "数"
      - "充実"
      - "本数"
      - "ジャンル"
      - "作品"
      - "動画"
      - "コンテンツ"
      - "ラインナップ"
    
  speed_response:
    name: "速度・反応性"
    description: "応答速度、処理速度、更新頻度"
    keywords:
      - "速度"
      - "早さ"
      - "迅速"
      - "対応"
      - "更新"
      - "頻度"
      - "新作"
      - "入れ替わり"
      - "反応"
      - "レスポンス"
    
  customization:
    name: "カスタマイズ性"
    description: "個人の好みへの対応、カスタマイズ機能"
    keywords:
      - "カスタマイズ"
      - "個別"
      - "パーソナル"
      - "設定"
      - "調整"
      - "好み"
      - "おすすめ"
      - "個人向け"
      - "最適化"
    
  support_service:
    name: "サポート・サービス"
    description: "顧客サポート、アフターサービス、相談対応"
    keywords:
      - "サポート"
      - "対応"
      - "サービス"
      - "フォロー"
      - "相談"
      - "問い合わせ"
      - "ヘルプ"
      - "アフター"
      - "ケア"

# 処理パラメータ
processing:
  temperature: 0.05          # Softmax正規化の温度
  coherence_threshold: 0.4   # Topic coherence検証閾値
  min_weight_threshold: 0.1  # 最小重み閾値

# ログ設定
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s" 